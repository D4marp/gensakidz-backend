name: gensakidz-backend

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # The app only ever connects as DB_USER — it never needs root, so we
      # let MySQL generate a random root password nobody has to manage.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-gensakidz}
      MYSQL_USER: ${DB_USER:-gensakidz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gensakidz}
    volumes:
      - gensakidz_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-gensakidz}", "-p${DB_PASSWORD:-gensakidz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "${HOST_PORT:-8097}:8080"
    env_file:
      - .env
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gensakidz.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-gensakidz2026}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-gensakidz}
      DB_PASSWORD: ${DB_PASSWORD:-gensakidz}
      DB_NAME: ${DB_NAME:-gensakidz}
    volumes:
      - gensakidz_uploads:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gensakidz_mysql:
  gensakidz_uploads:
