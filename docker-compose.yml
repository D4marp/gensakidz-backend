name: gensakidz-backend

services:
  backend:
    build: .
    ports:
      - "${HOST_PORT:-8097}:8080"
    env_file:
      - .env
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gensakidz.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-gensakidz2026}
    volumes:
      - gensakidz_data:/app/data
    restart: unless-stopped

volumes:
  gensakidz_data:
